name: Refresh exchange rates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-rates.py
      - .github/workflows/update-rates.yml
permissions:
  contents: write
concurrency:
  group: exchange-rates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate all currencies
        run: python scripts/update-rates.py
      - name: Publish only the exchange-rate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh SP Today exchange rates'
          git pull --rebase origin main
          git push origin HEAD:main
